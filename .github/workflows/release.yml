name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET 8 SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Determine version
      id: version
      shell: pwsh
      run: |
        # Tag 'v1.2.3' -> '1.2.3'. Manual runs (not on a tag) keep the version from NOTM.csproj.
        if ($env:GITHUB_REF -match '^refs/tags/v(\d+\.\d+\.\d+.*)$') {
          "value=$($Matches[1])" >> $env:GITHUB_OUTPUT
        } else {
          "value=" >> $env:GITHUB_OUTPUT
        }

    - name: Publish Single-File Executable
      shell: pwsh
      run: |
        $versionArg = if ('${{ steps.version.outputs.value }}') { '-p:Version=${{ steps.version.outputs.value }}' } else { '' }
        dotnet publish NOTM.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true $versionArg -o dist/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: dist/NOTM.exe
        name: NOTM ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
